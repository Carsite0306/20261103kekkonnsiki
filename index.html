<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>早押しボタン — ちょっと待てい！！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall-top:#EAEFE6;
    --wall-bottom:#DDE5DC;
    --floor:#E7E2D4;
    --floor-dark:#D8D2C1;
    --ink:#152744;
    --ink-soft:#3F5068;
    --red:#C0292B;
    --red-deep:#8E1B1D;
    --brass:#B08A4A;
    --brass-hi:#E8CE92;
    --line:rgba(21,39,68,.16);
    --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
    --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--body);
    color:var(--ink);
    background:var(--wall-bottom);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* ---------- studio cove ---------- */
  .stage{
    position:fixed;
    inset:0;
    background:
      radial-gradient(120% 80% at 50% 22%, #F3F6EF 0%, rgba(243,246,239,0) 55%),
      linear-gradient(180deg, var(--wall-top) 0%, #E6ECE2 52%, #E9E4D7 76%, var(--floor-dark) 100%);
    z-index:0;
  }
  .stage::after{ /* floor light pool */
    content:"";
    position:absolute;
    left:50%; bottom:2%;
    width:min(120vw,1100px); height:46vh;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.85), rgba(255,255,255,0) 62%);
    pointer-events:none;
  }
  .grain{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.35;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.28'/></svg>");
    mix-blend-mode:multiply;
  }

  /* ---------- chrome ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    padding:clamp(14px,2.4vh,24px) clamp(18px,4vw,40px);
    font-family:var(--mono);
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .brand{display:flex; align-items:center; gap:10px}
  .brand b{font-weight:700; color:var(--ink)}
  .brand span{opacity:.7}
  .onair{
    display:inline-flex; align-items:center; gap:9px;
    padding:7px 13px 7px 11px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(6px);
    font-size:10px;
  }
  .onair i{
    width:7px; height:7px; border-radius:50%;
    background:var(--red);
    box-shadow:0 0 0 0 rgba(192,41,43,.55);
  }
  .onair.is-live i{animation:lamp 1.1s ease-out infinite}
  .onair.is-live{color:var(--red); border-color:rgba(192,41,43,.35)}
  @keyframes lamp{
    0%{box-shadow:0 0 0 0 rgba(192,41,43,.55)}
    100%{box-shadow:0 0 0 9px rgba(192,41,43,0)}
  }

  /* ---------- main ---------- */
  main{
    position:relative; z-index:2;
    min-height:100dvh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:clamp(60px,8vh,86px) 20px clamp(96px,13vh,120px);
    text-align:center;
  }

  .head{display:flex; flex-direction:column; align-items:center; gap:14px}

  .seal{
    display:inline-flex; align-items:center; justify-content:center;
    padding:5px 10px 4px;
    background:var(--red);
    color:#fff;
    font-family:var(--mono);
    font-size:10px; font-weight:700; letter-spacing:.3em;
    text-indent:.3em;
    border-radius:2px;
    box-shadow:0 1px 0 var(--red-deep);
  }

  h1{
    margin:0;
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(24px,4.8vmin,46px);
    line-height:1.16;
    letter-spacing:.02em;
    color:var(--ink);
    text-wrap:balance;
  }
  h1 .pt{color:var(--red)}

  .lede{
    margin:0;
    font-size:clamp(12px,1.7vmin,14px);
    letter-spacing:.14em;
    color:var(--ink-soft);
  }

  /* ---------- buzzer ---------- */
  .presszone{
    position:relative;
    margin-top:clamp(4px,2vh,18px);
    display:flex; align-items:center; justify-content:center;
    width:min(86vw,42vh,420px);
    aspect-ratio:1/1;
  }
  .buzzer{
    position:relative;
    z-index:2;
    width:100%;
    aspect-ratio:1/1;
    border:0; padding:0;
    background:transparent;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    display:grid; place-items:center;
    transform:translateY(0) scale(1);
    transition:transform 170ms cubic-bezier(.2,.9,.25,1), filter 170ms ease;
    filter:drop-shadow(0 22px 26px rgba(21,39,68,.22));
  }
  .buzzer img{
    width:100%; height:100%; object-fit:contain;
    display:block; pointer-events:none;
  }
  .buzzer:hover{transform:translateY(-2px) scale(1.012); filter:drop-shadow(0 30px 30px rgba(21,39,68,.22))}
  .buzzer:focus-visible{outline:none}
  .buzzer:focus-visible::after{
    content:""; position:absolute; inset:6%;
    border:2px solid var(--ink); border-radius:50%;
    opacity:.55;
  }
  .buzzer.is-pressed{transform:translateY(9px) scale(.985); filter:drop-shadow(0 14px 16px rgba(21,39,68,.22))}

  .pool{
    position:absolute; z-index:0;
    width:132%; aspect-ratio:1/1; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #FFFFFF 0%, #FFFFFF 56%, rgba(255,255,255,.62) 66%, rgba(255,255,255,0) 78%);
    pointer-events:none;
  }

  /* shockwave */
  .ring{
    position:absolute; z-index:1;
    width:62%; aspect-ratio:1/1;
    border:2px solid rgba(192,41,43,.55);
    border-radius:50%;
    opacity:0; transform:scale(.7);
    pointer-events:none;
  }
  .ring.go{animation:wave 720ms cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes wave{
    0%{opacity:.9; transform:scale(.72)}
    100%{opacity:0; transform:scale(1.55)}
  }

  /* ---------- plaque ---------- */
  .plaque{
    margin-top:clamp(-6px,0vh,10px);
    position:relative; z-index:3;
    display:inline-flex; align-items:baseline; gap:14px;
    padding:11px 22px 10px;
    border-radius:4px;
    background:linear-gradient(180deg,#FBF7EC,#E4D8BC);
    border:1.5px solid rgba(150,115,56,.75);
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 8px 18px -10px rgba(21,39,68,.35);
    font-family:var(--mono);
    color:#6B5426;
  }
  .plaque .lab{font-size:9.5px; letter-spacing:.26em; text-transform:uppercase; opacity:.85}
  .plaque .val{font-size:21px; font-weight:700; letter-spacing:.04em; font-variant-numeric:tabular-nums; color:#4A3A19}

  /* ---------- footer strip ---------- */
  .strip{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap;
    padding:12px clamp(18px,4vw,40px) calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:linear-gradient(180deg, rgba(233,238,230,.35), rgba(233,238,230,.9));
    backdrop-filter:blur(8px);
    font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; color:#42536B;
  }
  .status{display:inline-flex; align-items:center; gap:10px; min-width:0}
  .status .dot{width:6px; height:6px; border-radius:50%; background:#9AA6B2; transition:background .2s}
  .status.live .dot{background:var(--red); box-shadow:0 0 8px rgba(192,41,43,.6)}
  .status .txt{font-weight:700; color:var(--ink); letter-spacing:.1em}

  .eq{display:inline-flex; align-items:flex-end; gap:3px; height:16px; margin-left:4px}
  .eq i{
    width:3px; height:4px; border-radius:1px;
    background:var(--red); opacity:.35;
    transition:height .2s;
  }
  .status.live .eq i{opacity:.95; animation:bounce 760ms ease-in-out infinite}
  .status.live .eq i:nth-child(2){animation-delay:.12s}
  .status.live .eq i:nth-child(3){animation-delay:.24s}
  .status.live .eq i:nth-child(4){animation-delay:.36s}
  .status.live .eq i:nth-child(5){animation-delay:.48s}
  @keyframes bounce{0%,100%{height:4px}50%{height:15px}}

  .meta{display:inline-flex; align-items:center; gap:18px; flex-wrap:wrap}
  .meta a{
    color:var(--ink); text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
    transition:border-color .2s, color .2s;
  }
  .meta a:hover{color:var(--red); border-color:var(--red)}
  .hint{opacity:.85; font-size:10px}

  /* fallback player, only if autoplay is blocked */
  .fallback{
    margin-top:14px;
    display:none;
    flex-direction:column; align-items:center; gap:8px;
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft);
  }
  .fallback.show{display:flex}
  .fallback iframe{width:min(80vw,260px); aspect-ratio:16/9; border:1px solid var(--line); border-radius:6px; background:#000}
  #yt{position:fixed; left:-3000px; top:0; width:320px; height:180px; opacity:0; pointer-events:none}

  @media (max-width:560px){
    .topbar{font-size:10px; letter-spacing:.16em}
    .brand span{display:none}
    .strip{font-size:10px; letter-spacing:.08em; justify-content:center; row-gap:8px; text-align:center}
    .hint{display:none}
    .presszone{width:min(88vw,40vh,380px)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
</style>
</head>

<div class="stage" aria-hidden="true"></div>

  <div class="brand"><b>STUDIO 03</b><span>/ 早押し室</span></div>

</header>

<div id="yt"></div>

<script>
(function(){
  const VIDEO_ID = "UMHtjoXkLss";
  const buzzer   = document.getElementById("buzzer");
  const ring     = document.getElementById("ring");
  const statusEl = document.getElementById("status");
  const statusTxt= document.getElementById("statusTxt");
  const onair    = document.getElementById("onair");
  const onairTxt = document.getElementById("onairTxt");
  const countEl  = document.getElementById("count");
  const fallback = document.getElementById("fallback");
  const slot     = document.getElementById("fallbackSlot");

  let count = 0, player = null, ready = false, pending = false, watchdog = null;

  /* ---------- YouTube IFrame API ---------- */
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    player = new YT.Player("yt", {
      videoId: VIDEO_ID,
      playerVars: {
        autoplay: 0, controls: 0, disablekb: 1, playsinline: 1,
        modestbranding: 1, rel: 0, origin: location.origin
      },
      events: {
        onReady: function(){ ready = true; if (pending) { pending = false; fire(); } },
        onStateChange: function(e){
          if (e.data === YT.PlayerState.PLAYING) { setLive(true); clearWatchdog(); }
          else if (e.data === YT.PlayerState.ENDED || e.data === YT.PlayerState.PAUSED) { setLive(false); }
        },
        onError: function(){ fail(); }
      }
    });
  };

  function fire(){
    if (!ready || !player) { pending = true; return; }
    try{
      player.seekTo(0, true);
      player.playVideo();
      setLive(true);            // optimistic UI; corrected by state
      startWatchdog();
    }catch(err){ fail(); }
  }

  function clearWatchdog(){ if (watchdog) { clearTimeout(watchdog); watchdog = null; } }

  /* if nothing is audible shortly after the press, offer a manual player */
  function startWatchdog(){
    clearWatchdog();
    watchdog = setTimeout(function(){
      let state = -1;
      try { state = player.getPlayerState(); } catch(e){}
      if (state !== 1) { fail(); }
    }, 3200);
  }

  function fail(){
    setLive(false);
    if (!slot.dataset.done) {
      slot.dataset.done = "1";
      const f = document.createElement("iframe");
      f.src = "https://www.youtube.com/embed/" + VIDEO_ID + "?autoplay=0&playsinline=1&rel=0";
      f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      f.allowFullscreen = true;
      f.title = "音源プレイヤー";
      slot.appendChild(f);
    }
    fallback.classList.add("show");
  }

  function setLive(v){
    statusEl.classList.toggle("live", v);
    onair.classList.toggle("is-live", v);
    statusTxt.textContent = v ? "再生中" : "待機中";
    onairTxt.textContent = v ? "ON AIR" : "STANDBY";
  }

  /* ---------- press ---------- */
  let pressTimer = null;
  function press(){
    count++;
    countEl.textContent = String(count).padStart(2, "0");

    buzzer.classList.add("is-pressed");
    clearTimeout(pressTimer);
    pressTimer = setTimeout(()=>buzzer.classList.remove("is-pressed"), 190);

    ring.classList.remove("go");
    void ring.offsetWidth;
    ring.classList.add("go");

    fire();
  }

  buzzer.addEventListener("click", press);
  document.addEventListener("keydown", function(e){
    if (e.code === "Space" || e.key === "Enter" || e.key === " ") {
      if (document.activeElement === buzzer && e.key === "Enter") return;
      e.preventDefault();
      press();
    }
  });

  /* pause the sound if the tab is hidden for a while */
  document.addEventListener("visibilitychange", function(){
    if (document.hidden && player && ready) {
      try { player.pauseVideo(); } catch(e){}
      setLive(false);
    }
  });
})();
</script>
